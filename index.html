<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>انباریار پرو</title>
<style>
@font-face{font-family:'Vazirmatn';src:local('Vazirmatn'),url('Vazirmatn.woff2') format('woff2');font-weight:100 900;font-display:swap}
:root{
  --bg:#eef3f8;--surface:#fff;--surface2:#e9eff6;--text:#0b1a2e;--muted:#60758c;--line:#dbe4ee;
  --brand:#2563eb;--brand2:#06b6d4;--red:#ef4444;--green:#10b981;--amber:#f59e0b;--blue:#3b82f6;--purple:#8b5cf6;
  --redbg:#fee2e2;--greenbg:#d1fae5;--amberbg:#fef3c7;--bluebg:#dbeafe;--purplebg:#ede9fe;--brandbg:#dbeafe;
  --navy:#0b1b3a;--navy2:#12306b;
  --sh:0 1px 2px rgba(11,26,46,.05),0 8px 24px -12px rgba(11,26,46,.16);
}
[data-theme=dark]{
  --bg:#07101e;--surface:#0f1c31;--surface2:#16273f;--text:#e7eef8;--muted:#8ba0b8;--line:#203550;
  --redbg:#3b1620;--greenbg:#0c3328;--amberbg:#3a2c0c;--bluebg:#13294f;--purplebg:#2a2250;--brandbg:#13294f;
  --sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Vazirmatn','Vazir','IRANSans','Samim',Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;overscroll-behavior-y:none}
body.noscroll{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:300px;background:radial-gradient(560px 230px at 88% -40px,rgba(37,99,235,.2),transparent 70%),radial-gradient(480px 210px at 8% -60px,rgba(6,182,212,.17),transparent 70%);pointer-events:none;z-index:0}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,textarea,select{font-family:inherit;font-size:15px;color:var(--text)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
a{color:inherit;text-decoration:none}
/* ---------- shell ---------- */
#shell{position:relative;z-index:1;min-height:100vh}
#main{max-width:680px;margin:0 auto;padding:0 14px 118px}
#side{display:none}
#top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 2px 10px}
#top h1{margin:0;font-size:18px;font-weight:900;line-height:1.25}
#top small{color:var(--muted);font-size:12px;display:block}
.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#2563eb,#06b6d4);display:grid;place-items:center;color:#fff;box-shadow:0 8px 18px -6px rgba(37,99,235,.65);flex-shrink:0}
.ibtn{width:42px;height:42px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;box-shadow:var(--sh);position:relative;flex-shrink:0}
.ibtn .dot{position:absolute;top:7px;left:7px;min-width:16px;height:16px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}.wrap{flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--sh)}
.card+.card{margin-top:12px}
.sect{display:flex;align-items:center;justify-content:space-between;margin:18px 4px 10px}.sect h3{margin:0;font-size:15px;font-weight:800}
.muted{color:var(--muted)}.xs{font-size:12px}.sm{font-size:13px}.b{font-weight:800}.c{text-align:center}
.red{color:var(--red)}.green{color:var(--green)}.amber{color:var(--amber)}.blue{color:var(--blue)}.brandc{color:var(--brand)}
.ltr{direction:ltr;unicode-bidi:plaintext}.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:15px;font-weight:800;font-size:14.5px;background:var(--surface2);transition:.15s}
.btn:active{transform:scale(.97)}.btn[disabled]{opacity:.45;pointer-events:none}
.btn.pri{background:linear-gradient(135deg,#2563eb,#06b6d4);color:#fff;box-shadow:0 10px 20px -10px rgba(37,99,235,.85)}
.btn.red{background:linear-gradient(135deg,#f43f5e,#ef4444);color:#fff}.btn.grn{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
.btn.amb{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:12px}.btn.blk{width:100%;margin-top:8px}.btn.ghost{background:transparent;border:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:700;white-space:nowrap;color:var(--muted);transition:.15s}
.chip.on{background:linear-gradient(135deg,#2563eb,#06b6d4);color:#fff;border-color:transparent;box-shadow:0 6px 14px -6px rgba(37,99,235,.7)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.p-red{background:var(--redbg);color:var(--red)}.p-green{background:var(--greenbg);color:var(--green)}.p-amber{background:var(--amberbg);color:#b7791f}
[data-theme=dark] .p-amber{color:var(--amber)}.p-blue{background:var(--bluebg);color:var(--blue)}.p-purple{background:var(--purplebg);color:var(--purple)}.p-gray{background:var(--surface2);color:var(--muted)}
.item{display:flex;align-items:center;gap:12px;padding:11px 12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);cursor:pointer;transition:transform .12s}
.item:active{transform:scale(.985)}.item+.item{margin-top:9px}
.av{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:17px;flex-shrink:0;overflow:hidden;background-size:cover;background-position:center}
.av.sq{border-radius:12px}
.stk{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sbox{display:flex;flex-direction:column;align-items:center;min-width:48px;padding:3px 8px;border-radius:12px;background:var(--surface2)}
.sbox small{font-size:10.5px;color:var(--muted);line-height:1.3;max-width:62px}.sbox b{font-size:15px;line-height:1.3}
.sbox.low{background:var(--amberbg)}.sbox.low b{color:#b7791f}.sbox.neg{background:var(--redbg)}.sbox.neg b{color:var(--red)}.sbox.zero b{color:var(--muted)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 14px;box-shadow:var(--sh)}
.search input{flex:1;border:0;background:transparent;padding:12px 0;outline:none;min-width:0}
.inp{width:100%;background:var(--surface2);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;outline:none;transition:.15s}
.inp:focus{border-color:var(--brand);background:var(--surface)}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:18px 52%,12px 52%;background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-left:34px}
textarea.inp{resize:vertical;min-height:70px}
.fld{margin-bottom:12px}.fld label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
/* KPI */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kc{position:relative;border-radius:20px;padding:13px 14px;color:#fff;overflow:hidden;box-shadow:0 12px 24px -14px rgba(0,0,0,.45);cursor:pointer}
.kc::after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.14);left:-24px;top:-30px}
.kc .t{font-size:12.5px;opacity:.92;font-weight:700}.kc .v{font-size:26px;font-weight:900;line-height:1.25;margin-top:2px}.kc .s{font-size:11px;opacity:.85}
.kc .ki{position:absolute;left:12px;bottom:10px;opacity:.5}.kc .ki svg{width:30px;height:30px}
.kc.blue{background:linear-gradient(135deg,#3b82f6,#2563eb)}.kc.green{background:linear-gradient(135deg,#22c55e,#059669)}.kc.amber{background:linear-gradient(135deg,#fbbf24,#f59e0b)}.kc.red{background:linear-gradient(135deg,#f87171,#ef4444)}.kc.purple{background:linear-gradient(135deg,#a78bfa,#7c3aed)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:11px;box-shadow:var(--sh)}
.kpi .t{font-size:11.5px;color:var(--muted)}.kpi .v{font-size:19px;font-weight:900;margin-top:2px}.kpi .s{font-size:11px;color:var(--muted)}
.qa{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 2px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-weight:800;font-size:12px;box-shadow:var(--sh)}
.qa .qi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
/* camera */
.cam{position:relative;border-radius:24px;overflow:hidden;background:#0a1626;aspect-ratio:4/3;box-shadow:var(--sh);border:2px solid transparent;transition:border-color .2s}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.cam.on video{display:block}
.cam .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#cfe0f3;text-align:center;padding:20px}
.cam.on .ph{display:none}
.reticle{position:absolute;inset:18% 10%;pointer-events:none;display:none}
.cam.on .reticle{display:block}
.reticle i{position:absolute;width:28px;height:28px;border:3px solid #fff;opacity:.95}
.reticle i:nth-child(1){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.reticle i:nth-child(2){top:0;left:0;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.reticle i:nth-child(3){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 10px 0}
.reticle i:nth-child(4){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 10px}
.laser{position:absolute;left:4%;right:4%;height:2px;background:linear-gradient(90deg,transparent,#ff4d4d,transparent);box-shadow:0 0 12px 2px rgba(255,77,77,.7);top:10%;animation:laser 2s ease-in-out infinite}
@keyframes laser{0%,100%{top:8%}50%{top:90%}}
.camst{position:absolute;top:8px;left:0;right:0;text-align:center;color:#fff;font-size:11px;opacity:.85;text-shadow:0 1px 3px #000;display:none}.cam.on .camst{display:block}
.camtools{position:absolute;bottom:10px;left:10px;right:10px;display:none;justify-content:space-between;align-items:center}
.cam.on .camtools{display:flex}
.camtools button{width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);color:#fff;display:grid;place-items:center}
.camtools button.on{background:#fbbf24;color:#000}
.cam.ok{border-color:var(--green);animation:okflash .5s}.cam.bad{border-color:var(--amber)}
@keyframes okflash{0%{box-shadow:0 0 0 0 rgba(16,185,129,.7)}100%{box-shadow:0 0 0 24px rgba(16,185,129,0)}}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--surface2);border-radius:18px;padding:4px}
.mb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px;border-radius:14px;background:transparent;font-weight:800;font-size:12.5px;color:var(--muted);transition:.2s}
.mb.on.sale{background:linear-gradient(135deg,#f43f5e,#ef4444);color:#fff}.mb.on.in{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
.mb.on.xfer{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff}.mb.on.out{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:38px;height:38px;border-radius:12px;background:var(--surface2);font-size:20px;font-weight:900;display:grid;place-items:center}
.stepper input{width:64px;text-align:center;font-size:17px;font-weight:900;padding:7px;direction:ltr}
.tic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.t-out{background:var(--redbg);color:var(--red)}.t-in{background:var(--greenbg);color:var(--green)}.t-xfer{background:var(--bluebg);color:var(--blue)}.t-adj{background:var(--purplebg);color:var(--purple)}
.last{border-width:1.5px}.last.out{border-color:rgba(239,68,68,.5)}.last.in{border-color:rgba(16,185,129,.5)}.last.xfer{border-color:rgba(59,130,246,.5)}
/* bottom nav */
#bnav{position:fixed;z-index:30;bottom:0;left:0;right:0;padding:0 12px calc(env(safe-area-inset-bottom) + 10px);pointer-events:none}
.nav-in{pointer-events:auto;max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:end;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;padding:8px 6px;box-shadow:0 18px 40px -16px rgba(11,26,46,.4)}
.nb{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0;border-radius:14px;position:relative}
.nb.on{color:var(--brand)}.nb.on::after{content:"";position:absolute;bottom:-3px;width:18px;height:3px;border-radius:3px;background:var(--brand)}
.fab{width:60px;height:60px;border-radius:22px;margin:-30px auto 0;background:linear-gradient(135deg,#2563eb,#06b6d4);color:#fff;display:grid;place-items:center;box-shadow:0 14px 26px -8px rgba(37,99,235,.9),0 0 0 6px var(--bg)}
.fab svg{width:27px;height:27px}.fab.on{outline:3px solid rgba(255,255,255,.55);outline-offset:-6px}
/* sheets */
.backdrop{position:fixed;inset:0;z-index:60;background:rgba(4,12,24,.58);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
.backdrop.top{z-index:90}
.sheet{width:100%;max-width:600px;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 20px);animation:su .28s cubic-bezier(.2,.9,.3,1)}
.sheet.cen{border-radius:28px;margin:auto 12px}.sheet.wide{max-width:760px}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 14px}
.sheet h2{margin:0 0 12px;font-size:18px;font-weight:900}
@keyframes su{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}@keyframes fd{from{opacity:0}to{opacity:1}}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.view{animation:up .3s ease}
.segctl{display:grid;gap:4px;background:var(--surface2);border-radius:16px;padding:4px;margin-bottom:12px}
.segctl button{padding:10px 4px;border-radius:12px;background:transparent;font-weight:800;color:var(--muted);font-size:13px;transition:.2s}
.segctl button.on{background:var(--brand);color:#fff}
.datebtn{display:flex;align-items:center;gap:8px;width:100%;background:var(--surface2);border-radius:14px;padding:12px 14px;font-weight:700;text-align:right}
.picklist{max-height:240px;overflow-y:auto;margin-top:8px;border-radius:14px;border:1px solid var(--line)}
.pick{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;background:transparent;text-align:right;border-bottom:1px solid var(--line)}.pick:last-child{border:0}
.dayh{display:flex;align-items:center;justify-content:space-between;margin:16px 4px 8px;font-weight:800;font-size:13.5px}
.dayh span{font-weight:600;font-size:11.5px;color:var(--muted)}
.mv{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;cursor:pointer}.mv+.mv{margin-top:8px}
.hb{display:flex;align-items:center;gap:10px;margin:7px 0}.hb .n{width:104px;font-size:12.5px}.hb .t{flex:1;height:11px;border-radius:11px;background:var(--surface2);overflow:hidden}.hb .t i{display:block;height:100%;border-radius:11px;background:linear-gradient(90deg,#2563eb,#06b6d4)}.hb .vv{width:44px;text-align:left;font-size:12.5px;font-weight:800}
svg.ch{width:100%;height:auto;display:block}svg.ch text{font-family:inherit;font-size:9.5px;fill:var(--muted)}.gline{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal .w{font-size:11.5px;color:var(--muted);font-weight:700;padding:4px 0}
.cal button{aspect-ratio:1;border-radius:12px;background:transparent;font-weight:700;font-size:14px}.cal button.fri{color:var(--red)}.cal button.now{box-shadow:inset 0 0 0 2px var(--brand)}.cal button.sel{background:var(--brand);color:#fff}
.toasts{position:fixed;z-index:120;bottom:calc(env(safe-area-inset-bottom) + 96px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:14px;background:#0b1a2e;color:#fff;padding:11px 16px;border-radius:16px;font-size:13.5px;box-shadow:0 12px 30px -8px rgba(0,0,0,.5);animation:up .25s;max-width:92vw}
.toast button{background:transparent;color:#7dd3fc;font-weight:800;font-size:13px}.toast.out{opacity:0;transform:translateY(8px);transition:.35s}
.empty{text-align:center;padding:30px 18px}.empty .em{font-size:50px;margin-bottom:6px}
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--amberbg);color:#92400e;font-size:13px;margin-bottom:12px}[data-theme=dark] .banner{color:#fcd34d}
.banner.red{background:var(--redbg);color:#b91c1c}[data-theme=dark] .banner.red{color:#fca5a5}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.bcbox{background:#fff;border-radius:14px;padding:10px;text-align:center;border:1px solid var(--line);margin:10px 0}.bcbox svg{max-width:100%;height:auto}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat2 .card{text-align:center;padding:12px}.stat2 .big{font-size:28px;font-weight:900;line-height:1.2}
/* table */
.tw{overflow-x:auto;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
.tbl th{background:var(--surface2);color:var(--muted);font-weight:800;font-size:11.5px;text-align:right;padding:9px 10px;white-space:nowrap;position:sticky;top:0}
.tbl td{padding:9px 10px;border-top:1px solid var(--line);white-space:nowrap}
.tbl tr.clk{cursor:pointer}.tbl tr.clk:active td{background:var(--surface2)}
.tbl td.n,.tbl th.n{text-align:center}
.tbl td.pos{color:var(--green);font-weight:800}.tbl td.neg{color:var(--red);font-weight:800}
/* doc lines */
.ln{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:16px}.ln+.ln{margin-top:8px}
.ln.warn{border-color:var(--amber);background:var(--amberbg)}.ln.bad{border-color:var(--red)}
.dochead{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sticky-act{position:sticky;bottom:92px;z-index:5;margin-top:14px}
/* count */
.cr{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px}.cr+.cr{margin-top:7px}
.cr.diff{border-color:var(--amber);background:var(--amberbg)}.cr.ok{border-color:rgba(16,185,129,.5)}
.cr input{width:74px;text-align:center;font-weight:900;direction:ltr;padding:8px}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;padding:4px 0 10px;min-height:46vh}
.msg{display:flex;gap:8px;align-items:flex-end;animation:up .25s}.msg.u{flex-direction:row}
.bub{max-width:86%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.75;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh)}
.msg.u .bub{background:linear-gradient(135deg,#2563eb,#06b6d4);color:#fff;border:0;border-bottom-right-radius:6px}
.msg.bot .bub{border-bottom-left-radius:6px}
.bub .row2{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-top:1px dashed var(--line)}.bub .row2:first-of-type{border:0}
.bot-av{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#2563eb);display:grid;place-items:center;color:#fff;flex-shrink:0}
.chatin{position:sticky;bottom:96px;display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 6px 6px 12px;box-shadow:var(--sh);z-index:6}
.chatin input{flex:1;border:0;background:transparent;outline:none;padding:10px 4px;min-width:0}
/* lock */
.lock{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,#0b1b3a,#12306b 60%,#0e7490);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:20px;gap:14px}
.lock .logo{width:64px;height:64px;border-radius:20px}
.pins{display:flex;gap:12px;margin:6px 0}.pins i{width:14px;height:14px;border-radius:50%;border:2px solid #fff;opacity:.8}.pins i.f{background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px}.pad button{height:62px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:22px;font-weight:800}.pad button:active{background:rgba(255,255,255,.3)}
.ulist{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:340px}
.ulist button{padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;font-weight:700}.ulist button.on{background:#fff;color:#12306b}
/* fullscreen scanner */
.scanfull{position:fixed;inset:0;z-index:70;background:#050c18;display:flex;flex-direction:column;animation:fd .2s}
.scanfull .sf-top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;color:#fff}
.scanfull .cam{flex:0 0 auto;border-radius:0;aspect-ratio:auto;height:44vh;box-shadow:none}
.scanfull .sf-body{flex:1;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:14px}
/* sidebar (desktop) */
@media(min-width:920px){
  #shell{display:grid;grid-template-columns:1fr 252px;}
  #side{display:flex;flex-direction:column;order:2;position:sticky;top:0;height:100vh;background:linear-gradient(180deg,var(--navy),var(--navy2));color:#cfe0f3;padding:16px 12px;overflow-y:auto}
  #main{order:1;max-width:1100px;width:100%;margin:0 auto;padding:0 26px 40px}
  #bnav{display:none}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .toasts{bottom:30px}
  .sticky-act{bottom:12px}.chatin{bottom:12px}
  .dgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;align-items:start}
  .dgrid .card+.card{margin-top:0}
  .sheet{border-radius:28px;margin:auto}.backdrop{align-items:center}
  .qa{grid-template-columns:repeat(5,1fr)}
  .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pgrid .item+.item{margin-top:0}
}
.sb-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;color:#fff}.sb-brand b{font-size:17px;display:block;line-height:1.2}.sb-brand small{opacity:.7;font-size:11px}
.sb-i{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;font-weight:700;font-size:14px;color:#b8cbe4;width:100%;text-align:right;margin-bottom:3px}
.sb-i:hover{background:rgba(255,255,255,.07)}.sb-i.on{background:linear-gradient(135deg,#2563eb,#0ea5e9);color:#fff;box-shadow:0 10px 20px -10px rgba(14,165,233,.9)}
.sb-i .cnt{margin-right:auto;background:#ef4444;color:#fff;border-radius:9px;font-size:10.5px;padding:0 6px;font-weight:800}
.sb-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:#9fb4d0}
.moregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.moregrid button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px;border-radius:18px;background:var(--surface2);font-weight:800;font-size:12.5px}
@media print{body::before,#bnav,#side,#top,.noprint,.toasts{display:none!important}#main{max-width:none;padding:0}.card{box-shadow:none}body{background:#fff;color:#000}}

.nbdot{position:absolute;top:0;left:22%;min-width:16px;height:16px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}

.msg.u{justify-content:flex-end}
#lockRoot{position:relative;z-index:200}
#shell.hide{visibility:hidden}

/* ---- Persian text normalisation / fuzzy ---- */
const normFa=s=>en(String(s||'')).toLowerCase().replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/[ۀة]/g,'ه').replace(/[أإآ]/g,'ا').replace(/[ً-ٰٟـ]/g,'').replace(/[‌‍‎‏]/g,' ').replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function tokSim(q,t){if(q===t)return 1;if(q.length>=3&&(t.startsWith(q)||q.startsWith(t)&&t.length>=3))return .9;if(q.length>=3&&t.includes(q))return .8;const L=Math.max(q.length,t.length);if(L<4)return 0;const s=1-lev(q,t)/L;return s>=.7?s*.85:0}

/* ================= Jalali ================= */
const div=(a,b)=>~~(a/b),mod=(a,b)=>a-~~(a/b)*b;
const BRK=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
function jalCal(jy,noLeap){const bl=BRK.length;let gy=jy+621,leapJ=-14,jp=BRK[0],jm,jump,leap,leapG,march,n,i;
 for(i=1;i<bl;i++){jm=BRK[i];jump=jm-jp;if(jy<jm)break;leapJ+=div(jump,33)*8+div(mod(jump,33),4);jp=jm}
 n=jy-jp;leapJ+=div(n,33)*8+div(mod(n,33)+3,4);if(mod(jump,33)===4&&jump-n===4)leapJ+=1;
 leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;march=20+leapJ-leapG;if(noLeap)return{gy,march};
 if(jump-n<6)n=n-jump+div(jump+4,33)*33;leap=mod(mod(n+1,33)-1,4);if(leap===-1)leap=4;return{leap,gy,march}}
function g2d(gy,gm,gd){let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;return d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752}
function d2g(jdn){let j=4*jdn+139361631;j+=div(div(4*jdn+183187720,146097)*3,4)*4-3908;const i=div(mod(j,1461),4)*5+308;const gd=div(mod(i,153),5)+1,gm=mod(div(i,153),12)+1,gy=div(j,1461)-100100+div(8-gm,6);return{gy,gm,gd}}

function d2j(jdn){const gy=d2g(jdn).gy;let jy=gy-621;const r=jalCal(jy),f=g2d(gy,3,r.march);let k=jdn-f;
 if(k>=0){if(k<=185)return{jy,jm:1+div(k,31),jd:mod(k,31)+1};k-=186}else{jy-=1;k+=179;if(r.leap===1)k+=1}return{jy,jm:7+div(k,30),jd:mod(k,30)+1}}
const jLen=(y,m)=>m<=6?31:m<=11?30:(jalCal(y).leap===0?30:29);
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

const parse=iso=>{const[y,m,d]=iso.split('-').map(Number);return{y,m,d}};
const addDays=(iso,n)=>{const p=parse(iso);return isoOf(new Date(p.y,p.m-1,p.d+n))};
const diffDays=(a,b)=>{const p=parse(a),q=parse(b);return Math.round((Date.UTC(q.y,q.m-1,q.d)-Date.UTC(p.y,p.m-1,p.d))/864e5)};
const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WDAYS=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
const toJ=iso=>{const p=parse(iso);return d2j(g2d(p.y,p.m,p.d))};
const fromJ=(jy,jm,jd)=>{const g=d2g(j2d(jy,jm,jd));return g.gy+'-'+pad(g.gm)+'-'+pad(g.gd)};
const dFull=iso=>{if(!iso)return'—';const j=toJ(iso);return fa(j.jd)+' '+MONTHS[j.jm-1]+' '+fa(j.jy)};
const dShort=iso=>{if(!iso)return'—';const j=toJ(iso);return fa(j.jd)+' '+MONTHS[j.jm-1]};
const dNum=iso=>{const j=toJ(iso);return fa(j.jy+'/'+pad(j.jm)+'/'+pad(j.jd))};
const wday=iso=>{const p=parse(iso);return WDAYS[new Date(p.y,p.m-1,p.d).getDay()]};
const hhmm=ts=>{const d=new Date(ts);return fa(pad(d.getHours())+':'+pad(d.getMinutes()))};
function rel(iso){if(!iso)return'—';const d=diffDays(iso,todayISO());return d===0?'امروز':d===1?'دیروز':fa(d)+' روز پیش'}


/* ================= EAN / UPC (encoder + decoder) ================= */
const L_BITS=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
const R_BITS=L_BITS.map(s=>s.replace(/[01]/g,c=>c==='0'?'1':'0'));
const G_BITS=R_BITS.map(s=>[...s].reverse().join(''));
const PAR=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
const runsOf=b=>{const r=[];let c=b[0],n=0;for(const x of b){if(x===c)n++;else{r.push(n);c=x;n=1}}r.push(n);return r};
const LW=L_BITS.map(runsOf),GW=G_BITS.map(runsOf);
function eanOK(s){if(!/^\d+$/.test(s))return false;const d=s.split('').map(Number),k=d.pop();let t=0;d.reverse().forEach((x,i)=>t+=x*(i%2?1:3));return(10-t%10)%10===k}
function eanCheck(d12){let t=0;d12.split('').reverse().forEach((x,i)=>t+=(+x)*(i%2?1:3));return String((10-t%10)%10)}
function eanBits(c){
 if(c.length===13){const p=PAR[+c[0]];let b='101';for(let i=0;i<6;i++){const d=+c[i+1];b+=p[i]==='L'?L_BITS[d]:G_BITS[d]}b+='01010';for(let i=7;i<13;i++)b+=R_BITS[+c[i]];return b+'101'}

const normEAN=c=>c.length===12?'0'+c:c;
const canEAN=c=>/^\d+$/.test(c)&&(c.length===13||c.length===8||c.length===12)&&eanOK(c);
function eanSVG(code,o={}){code=normEAN(code);const m=o.m||2,h=o.h||64,bits=eanBits(code),q=9,W=(bits.length+q*2)*m,H=h+20;let r='',i=0;
 while(i<bits.length){if(bits[i]==='1'){let j=i;while(j<bits.length&&bits[j]==='1')j++;r+=`<rect x="${(q+i)*m}" y="0" width="${(j-i)*m}" height="${h}"/>`;i=j}else i++}
 return`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><rect width="${W}" height="${H}" fill="#fff"/><g fill="#000">${r}</g><text x="${W/2}" y="${h+15}" text-anchor="middle" font-family="monospace" font-size="14" fill="#000" letter-spacing="2">${code}</text></svg>`}
function eanCanvas(code,m,h,pad_){code=normEAN(code);const bits=eanBits(code),q=pad_||12,cv=document.createElement('canvas');cv.width=(bits.length+q*2)*m;cv.height=h;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,h);x.fillStyle='#000';
 for(let i=0;i<bits.length;i++)if(bits[i]==='1')x.fillRect((q+i)*m,Math.round(h*.12),m,Math.round(h*.76));return cv}
function matchDigit(w,i,right,lim){const t=w[i]+w[i+1]+w[i+2]+w[i+3];if(!(t>0))return null;const u=t/7;let be=9,bd=-1,bt='';
 const cand=right?[['R',LW]]:[['L',LW],['G',GW]];
 for(const[ty,T]of cand)for(let d=0;d<10;d++){const p=T[d];let e=0;for(let k=0;k<4;k++){const x=w[i+k]/u-p[k];e+=x*x}if(e<be){be=e;bd=d;bt=ty}}
 return be<lim?{d:bd,t:bt}:null}
const gOK=(w,i,n,u)=>{for(let k=0;k<n;k++){const r=w[i+k]/u;if(r<.3||r>2.4)return false}return true};
function decodeAt(w,s,n){const lim=n===13?1.4:0.6,half=n===13?6:4,need=3+half*4+5+half*4+3;if(s+need>w.length)return null;
 const u=(w[s]+w[s+1]+w[s+2])/3;if(!(u>0)||!gOK(w,s,3,u))return null;
 let o=s+3;const digs=[];let par='';
 for(let k=0;k<half;k++){const m=matchDigit(w,o,false,lim);if(!m)return null;digs.push(m.d);par+=m.t;o+=4}
 if(!gOK(w,o,5,u))return null;o+=5;
 for(let k=0;k<half;k++){const m=matchDigit(w,o,true,lim);if(!m)return null;digs.push(m.d);o+=4}
 if(!gOK(w,o,3,u))return null;
 let code;if(n===13){const f=PAR.indexOf(par);if(f<0)return null;code=f+digs.join('')}else{if(par!=='LLLL')return null;code=digs.join('')}
 return eanOK(code)?code:null}
function tryRuns(w,c0,a8){for(let s=0;s+43<=w.length;s++){if((c0^(s&1))!==1)continue;const r=decodeAt(w,s,13)||(a8&&decodeAt(w,s,8));if(r)return r}return null}
function lineToRuns(line){const n=line.length,W=Math.max(24,(n/7)|0),ps=new Float32Array(n+1);for(let i=0;i<n;i++)ps[i+1]=ps[i]+line[i];
 const w=[];let cur=-1,st=0,c0=0;
 for(let x=0;x<n;x++){const a=Math.max(0,x-W),b=Math.min(n,x+W+1),mean=(ps[b]-ps[a])/(b-a),dk=line[x]<mean*.92-2?1:0;
  if(dk!==cur){if(cur!==-1)w.push(x-st);else c0=dk;cur=dk;st=x}}
 w.push(n-st);return{w,c0}}
function decodeLine(line,a8){const{w,c0}=lineToRuns(line);if(w.length<43)return null;
 let r=tryRuns(w,c0,a8);if(r)return r;

/* G: Uint8 gray, width sw, height sh */
function scanGray(G,sw,sh){for(const a8 of [false,true]){const r=scanGray1(G,sw,sh,a8);if(r)return r}return null}
function scanGray1(G,sw,sh,a8){
 const fr=[.5,.45,.55,.4,.6,.35,.65,.3,.7,.25,.75,.2,.8,.15,.85,.1,.9];
 for(const f of fr){const y=Math.round(sh*f),ln=new Float32Array(sw);for(let x=0;x<sw;x++){let a=0,c=0;for(let d=-1;d<=1;d++){const yy=y+d;if(yy>=0&&yy<sh){a+=G[yy*sw+x];c++}}ln[x]=a/c}const r=decodeLine(ln,a8);if(r)return r}
 for(const f of [.5,.42,.58,.34,.66,.26,.74]){const x=Math.round(sw*f),ln=new Float32Array(sh);for(let y=0;y<sh;y++){let a=0,c=0;for(let d=-1;d<=1;d++){const xx=x+d;if(xx>=0&&xx<sw){a+=G[y*sw+xx];c++}}ln[y]=a/c}const r=decodeLine(ln,a8);if(r)return r}
 return null}

function fallbackDecode(v){const W=v.videoWidth,H=v.videoHeight;if(!W)return null;const sw=Math.min(1280,W),sh=Math.round(H*sw/W);
 if(!_cv){_cv=document.createElement('canvas')}_cv.width=sw;_cv.height=sh;const cx=_cv.getContext('2d',{willReadFrequently:true});cx.drawImage(v,0,0,sw,sh);
 const d=cx.getImageData(0,0,sw,sh).data,G=new Uint8Array(sw*sh);for(let i=0,j=0;i<d.length;i+=4,j++)G[j]=(d[i]*77+d[i+1]*150+d[i+2]*29)>>8;return scanGray(G,sw,sh)}

function migrateV1(o){const d=blank(),t=Date.now();
 d.products=(o.products||[]).map((p,i)=>({id:p.id,name:p.name,code:'P'+String(i+1).padStart(4,'0'),barcode:p.barcode||'',cat:'',brand:'',unit:p.unit||'عدد',min:p.min||0,loc:'',img:'',desc:'',alias:[],created:p.createdAt||t,u:t}));

 d.moves=(o.moves||[]).map(m=>{const x={id:m.id,doc:m.id,no:0,pid:m.pid,date:m.date,ts:m.ts||t,note:m.note||'',party:'',inv:'',reason:'',user:'',u:m.ts||t};

/* ---- derived stock ---- */
function recalc(){PM={};BM={};ST={};WM={};CM={};
 db.wh.forEach(w=>WM[w.id]=w);db.cats.forEach(c=>CM[c.id]=c);
 db.products.forEach(p=>{PM[p.id]=p;if(p.barcode)BM[bkey(p.barcode)]=p.id;const w={};db.wh.forEach(x=>w[x.id]=0);ST[p.id]={t:0,w,lastIn:'',lastOut:'',in30:0,out30:0,in7:0,out7:0}});
 const t=todayISO(),d7=addDays(t,-6),d30=addDays(t,-29);
 for(const m of db.moves){const s=ST[m.pid];if(!s)continue;
  if(m.type==='in'){s.w[m.wh]=(s.w[m.wh]||0)+m.qty;s.t+=m.qty;if(m.date>s.lastIn)s.lastIn=m.date;if(m.date>=d30)s.in30+=m.qty;if(m.date>=d7)s.in7+=m.qty}
  else if(m.type==='out'){s.w[m.wh]=(s.w[m.wh]||0)-m.qty;s.t-=m.qty;if(m.date>s.lastOut)s.lastOut=m.date;if(m.date>=d30)s.out30+=m.qty;if(m.date>=d7)s.out7+=m.qty}
  else if(m.type==='xfer'){s.w[m.wh]=(s.w[m.wh]||0)-m.qty;s.w[m.to]=(s.w[m.to]||0)+m.qty}
  else if(m.type==='adj'){s.w[m.wh]=(s.w[m.wh]||0)+m.delta;s.t+=m.delta}}
 const r=x=>Math.round(x*1000)/1000;
 for(const id in ST){const s=ST[id];s.t=r(s.t);for(const k in s.w)s.w[k]=r(s.w[k])}}
const stockAt=(pid,wh)=>(ST[pid]&&ST[pid].w[wh])||0;
function status(p){const s=ST[p.id];if(!s)return'ok';if(s.t<0||Object.values(s.w).some(v=>v<0))return'neg';if(s.t<=0)return'out';if(p.min>0&&s.t<=p.min)return'low';return'ok'}

function commitDoc(d){/* d:{type,wh,to,date,party,inv,reason,note,disc,lines:[{pid,qty,pr}]} */
 const doc=uid(),no=++db.seq[d.type],ts=Date.now(),out=[];let k=0;
 const money=d.type==='in'||d.type==='out',gross=sum(d.lines,l=>l.qty>0&&PM[l.pid]?l.qty*(+l.pr||0):0),fac=(d.type==='out'&&d.disc>0&&gross>0)?Math.max(0,1-d.disc/gross):1;
 for(const l of d.lines){if(!(l.qty>0)||!PM[l.pid])continue;const p=PM[l.pid];
  const m={id:uid(),doc,no,pid:l.pid,type:d.type,qty:l.qty,wh:d.wh,date:d.date||todayISO(),ts:ts+(k++),reason:d.reason||'',party:d.party||'',inv:d.inv||'',note:d.note||'',user:curName(),u:ts+k};
  if(money){const pr=Math.round((+l.pr||0)*fac*100)/100;m.pr=pr;
   if(d.type==='out'){m.cost=p.buy||0;if(pr>0&&!p.sell&&(d.reason||'sale')==='sale'){p.sell=Math.round((+l.pr||0));touch(p)}}
   else if(pr>0&&(d.reason||'buy')==='buy'){p.buy=pr;touch(p)}}
  if(d.type==='xfer')m.to=d.to;out.push(m)}
 if(!out.length)return null;
 db.moves.push(...out);
 addLog(d.type,T_NAME[d.type]+' #'+fa(no)+' — '+fa(out.length)+' قلم'+(d.party?' — '+d.party:'')+(money&&gross>0?' — '+N(Math.round(gross*fac))+' '+((db.settings&&db.settings.cur)||'تومان'):''));
 save();recalc();return{doc,no,moves:out}}

const COLS=['products','moves','wh','cats','users','counts','log'];

const _u=r=>typeof r.u==='number'?r.u:0;
function mergeDb(a,b,now){now=now||Date.now();const dead={};
 for(const s of [a.dead||{},b.dead||{}])for(const k in s)if(typeof s[k]==='number')dead[k]=Math.max(dead[k]||0,s[k]);
 const out={v:2};
 for(const col of COLS){const best=new Map();
  for(const r of [...(a[col]||[]),...(b[col]||[])]){if(!r||!r.id)continue;const o=best.get(r.id);if(!o||_u(r)>_u(o))best.set(r.id,r)}
  out[col]=[];for(const r of best.values()){const d=dead[r.id];if(d&&d>=_u(r))continue;if(d)delete dead[r.id];out[col].push(r)}}
 const pids=new Set(out.products.map(p=>p.id));out.moves=out.moves.filter(m=>pids.has(m.pid));
 out.log=out.log.sort((x,y)=>x.ts-y.ts).slice(-1500);
 for(const k of Object.keys(dead))if(now-dead[k]>DEAD_TTL)delete dead[k];
 out.dead=dead;
 const sa=a.seq||{},sb=b.seq||{};out.seq={};for(const k of new Set([...Object.keys(sa),...Object.keys(sb)]))out.seq[k]=Math.max(sa[k]||0,sb[k]||0);
 const ta=a.settings||{},tb=b.settings||{};let t=(tb.su||0)>(ta.su||0)?tb:ta;if(!t.name&&(ta.name||tb.name))t=ta.name?ta:tb;out.settings={name:t.name,su:t.su||0};
 return out}

  try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:db.prefs.cam||'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
   if(!this.host){st.getTracks().forEach(t=>t.stop());return}
   this.stream=st;const v=this.video;v.srcObject=st;await v.play().catch(()=>{});this.on=true;this.host.classList.add('on');try{localStorage.setItem('anb_camok','1')}catch(e){}
   try{const tr=st.getVideoTracks()[0],cp=tr.getCapabilities?tr.getCapabilities():{};if(cp.focusMode&&cp.focusMode.includes('continuous'))await tr.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}
   this.det=null;if('BarcodeDetector' in window){try{const sup=await BarcodeDetector.getSupportedFormats();const want=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','qr_code'].filter(f=>sup.includes(f));if(want.length)this.det=new BarcodeDetector({formats:want})}catch(e){}}

  catch(e){this.on=false;this.msg((e&&e.name==='NotAllowedError')?'اجازهٔ دوربین داده نشد.<br><span class="xs">روی آیکون قفل کنار آدرس بزن و دوربین را مجاز کن.</span>':'دوربین پیدا یا باز نشد.<br><span class="xs">'+esc(e&&e.name||'')+'</span>')}},
 stop(){this.on=false;clearTimeout(this.timer);if(this.stream){this.stream.getTracks().forEach(t=>t.stop());this.stream=null}if(this.video)this.video.srcObject=null;if(this.host){this.host.classList.remove('on');const t=this.host.querySelector('.camTorch');if(t)t.classList.remove('on')}this.torch=false},

  if(this.busy||document.hidden||Cam.paused)return;const v=this.video;if(!v||v.readyState<2)return;this.busy=true;

   if(code){const now=Date.now(),st=this.seenMap[code]||(this.seenMap[code]={seen:0,armed:true});

async function decodePhoto(f){let code=null;try{const bmp=await createImageBitmap(f);
 if('BarcodeDetector' in window){try{const r=await new BarcodeDetector().detect(bmp);if(r.length)code=r[0].rawValue}catch(e){}}
 for(const mw of [1600,1000,2200]){if(code)break;for(const rot of [0,90,180,270]){
  const sc=Math.min(1,mw/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*sc),h=Math.round(bmp.height*sc),sw=rot%180?h:w,sh=rot%180?w:h;
  const cv=document.createElement('canvas');cv.width=sw;cv.height=sh;const x=cv.getContext('2d',{willReadFrequently:true});x.translate(sw/2,sh/2);x.rotate(rot*Math.PI/180);x.drawImage(bmp,-w/2,-h/2,w,h);
  const d=x.getImageData(0,0,sw,sh).data,G=new Uint8Array(sw*sh);for(let i=0,j=0;i<d.length;i+=4,j++)G[j]=(d[i]*77+d[i+1]*150+d[i+2]*29)>>8;
  code=scanGray(G,sw,sh);if(code)break}}}catch(e){}return code}

 drawDocTot();const s=$('#docSum');if(s)s.textContent=DOC.lines.length?`· ${fa(DOC.lines.length)} قلم، جمع ${N(sum(DOC.lines,l=>l.qty))}`:''}

  if(delta){commitAdj(c.wh,p.id,r,{doc,no:c.no,note:note||'انبارگردانی',reason:'count',date:c.date});n++}}

 else if(RP.range==='all'){f=db.moves.reduce((m,x)=>x.date<m?x.date:m,t)}

function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:type+';charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
const csvq=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
function turnRows(f,e,wh){/* opening must be net of earlier in/out/adj/xfer: recompute properly */
 const R={};db.products.forEach(p=>R[p.id]={p,open:0,in:0,out:0,adj:0,xf:0});
 for(const m of db.moves){const r=R[m.pid];if(!r||m.date>e)continue;const before=m.date<f;
  const eff=(w)=>wh==='all'||w===wh;
  if(m.type==='in'&&eff(m.wh)){if(before)r.open+=m.qty;else r.in+=m.qty}
  else if(m.type==='out'&&eff(m.wh)){if(before)r.open-=m.qty;else r.out+=m.qty}
  else if(m.type==='adj'&&eff(m.wh)){if(before)r.open+=m.delta;else r.adj+=m.delta}
  else if(m.type==='xfer'&&wh!=='all'){const d=(m.to===wh?m.qty:0)-(m.wh===wh?m.qty:0);if(before)r.open+=d;else r.xf+=d}}
 return Object.values(R).map(r=>({...r,close:Math.round((r.open+r.in-r.out+r.adj+r.xf)*1000)/1000,open:Math.round(r.open*1000)/1000})).filter(r=>r.open||r.in||r.out||r.adj||r.xf||r.close)}

 for(;j<toks.length;j++){const w=toks[j];
  if(/^\d+(?:x\d+)?$/.test(w)){if(got&&dig&&cur>0)break;cur+=parseFloat(w.replace('x','.'));got=true;dig=true;continue}
  if(w==='هزار'||w==='میلیون'){const k=w==='هزار'?1e3:1e6;total+=(cur||1)*k;cur=0;mult=true;got=true;dig=false;continue}
  if(w in NUMX){cur+=NUMX[w];got=true;continue}
  if(w in NUMW){if(got&&!dig&&NUMW[w]<10&&cur%10!==0&&cur>0)break;cur+=NUMW[w];got=true;dig=false;continue}

  if(isNumTok(w)){const r=readNum(toks,i);let j=r.next;if(j===i){i++;continue}const nx=toks[j];let isPrice=false;
   if(nx&&PRICEW.has(nx)){isPrice=true;j++}else if(r.mult||(r.val>=1000&&!(nx in UNITW)))isPrice=true;
   if(isPrice){let v=r.val;if(nx==='ریال')v/=10;const pv=toks[i-1]||'',per=['هر','هرکدوم','هرکدام'].includes(pv)||(pv.length>3&&/یی$/.test(pv));

   let unit='';if(toks[j] in UNITW){unit=UNITW[toks[j]];j++}let q=r.val;if(unit==='g'){q=q/1000;unit='کیلوگرم'}
   if(qf){if(cur.name.length){items.push(cur);cur=fresh()}cur.qty=q;cur.unit=unit}
   else{if(cur.name.length&&cur.qty===null){cur.qty=q;cur.unit=unit}else{if(cur.name.length){items.push(cur);cur=fresh()}cur.qty=q;cur.unit=unit}}

  if(FILLW.has(w)){i++;continue}

VIEWS.users={html(){return`<div class="card"><div class="row"><div class="tic t-adj" style="width:44px;height:44px;border-radius:14px">${ic('users',22)}</div><div class="sp"><div class="b">کاربران و دسترسی‌ها</div><div class="xs muted">${db.users.length?'قفل ورود با رمز ۴ رقمی فعال است':'تا وقتی کاربری نسازی، برنامه بدون رمز باز می‌شود'}</div></div><button class="btn sm pri" onclick="userForm()">${ic('plus',16)} کاربر</button></div></div>
 <div class="hint" style="margin:8px 4px"><b>مدیر:</b> همه‌چیز · <b>انباردار:</b> کالا، ورود/خروج/انتقال، انبارگردانی، گزارش · <b>فروشنده:</b> فقط فروش (خروج) و دیدن موجودی. این قفل فقط روی همین گوشی اعمال می‌شود.</div>
 ${db.users.map(u=>`<div class="item" onclick="userForm('${u.id}')"><div class="av" style="background:linear-gradient(135deg,hsl(${hue(u.name)} 65% 52%),hsl(${(hue(u.name)+40)%360} 65% 44%))">${esc(u.name.charAt(0))}</div><div class="sp"><div class="b">${esc(u.name)}</div><div class="xs muted">${ROLES[u.role]}${CUR&&CUR.id===u.id?' · شما':''}</div></div>${ic('chev',18)}</div>`).join('')}
 <div class="sect"><h3>گزارش فعالیت</h3></div><div class="card">${logHtml(80)}</div>`}};
function userForm(id){const u=id?db.users.find(x=>x.id===id):null;
 sheet(`<h2>${u?'ویرایش کاربر':'کاربر جدید'}</h2><div class="fld"><label>نام</label><input id="ufName" class="inp" value="${esc(u?u.name:'')}"></div>
 <div class="fld"><label>نقش</label><select id="ufRole" class="inp">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${u&&u.role===k||(!u&&!db.users.length&&k==='admin')?'selected':''}>${v}</option>`).join('')}</select></div>
 <div class="fld"><label>رمز ۴ رقمی ${u?'(خالی = بدون تغییر)':''}</label><input id="ufPin" class="inp ltr" inputmode="numeric" maxlength="4" placeholder="••••" style="letter-spacing:8px;text-align:center;font-size:20px"></div>
 ${!db.users.length?'<div class="banner">با ساخت اولین کاربر، قفل برنامه فعال می‌شود. اولین کاربر باید «مدیر» باشد و رمزش را فراموش نکن.</div>':''}
 <div class="grid2"><button class="btn pri" onclick="userSave('${id||''}')">${ic('check')} ذخیره</button>${u?`<button class="btn" style="color:var(--red)" onclick="userDel('${id}')">${ic('trash',16)} حذف</button>`:'<button class="btn" onclick="closeSheet()">انصراف</button>'}</div>`)}
async function userSave(id){const name=$('#ufName').value.trim(),role=$('#ufRole').value,pin=en($('#ufPin').value).trim();if(!name)return toast('نام را بنویس');
 let u=id?db.users.find(x=>x.id===id):null;if(!u&&!/^\d{4}$/.test(pin))return toast('رمز باید ۴ رقم باشد');if(pin&&!/^\d{4}$/.test(pin))return toast('رمز باید ۴ رقم باشد');
 if(db.users.some(x=>x.id!==id&&x.name===name))return toast('این نام قبلاً هست');
 if(!db.users.length&&role!=='admin')return toast('اولین کاربر باید مدیر باشد');
 if(u&&u.role==='admin'&&role!=='admin'&&db.users.filter(x=>x.role==='admin').length<=1)return toast('باید حداقل یک مدیر بماند');
 const first=!db.users.length;
 if(!u){u=touch({id:uid(),name,role,pin:''});db.users.push(u)}else{u.name=name;u.role=role}
 if(pin)u.pin=await pinHash(u.id,pin);touch(u);addLog('user','کاربر «'+name+'» ('+ROLES[role]+') ذخیره شد');
 if(first){CUR=u;sessSet(u)}else if(CUR&&CUR.id===u.id)CUR=u;
 save();closeSheet();layout();rerender();toast('✓ ذخیره شد')}
function userDel(id){const u=db.users.find(x=>x.id===id);if(u.role==='admin'&&db.users.filter(x=>x.role==='admin').length<=1)return toast('باید حداقل یک مدیر بماند');
 confirmBox(`کاربر «${u.name}» حذف شود؟`,'حذف',()=>{db.users=db.users.filter(x=>x.id!==id);db.dead[id]=Date.now();addLog('user','حذف کاربر «'+u.name+'»');if(CUR&&CUR.id===id){CUR=null;sessSet(null)}save();closeSheet();if(db.users.length&&!CUR)showLock();else{layout();rerender()}})}
function sessSet(u){try{if(u)localStorage.setItem('anb_sess',JSON.stringify({id:u.id,t:Date.now()}));else localStorage.removeItem('anb_sess')}catch(e){}}
function sessGet(){try{return JSON.parse(localStorage.getItem('anb_sess')||'null')}catch(e){return null}}
function logout(){CUR=null;sessSet(null);if(db.users.length)showLock();else{layout();rerender()}}
function showLock(sel){const root=$('#lockRoot');let pick=sel||(db.users.find(u=>u.id===(sessGet()||{}).id)||db.users[0]||{}).id,pin='';
 function draw(){root.innerHTML=`<div class="lock"><div class="logo">${ic('cube',34)}</div><div class="b" style="font-size:20px">${esc(db.settings.name)}</div><div class="ulist">${db.users.map(u=>`<button class="${u.id===pick?'on':''}" onclick="window.__lk.pick('${u.id}')">${esc(u.name)}</button>`).join('')}</div>
  <div style="opacity:.8;font-size:13px">رمز ۴ رقمی را وارد کن</div><div class="pins">${[0,1,2,3].map(i=>`<i class="${i<pin.length?'f':''}"></i>`).join('')}</div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>`<button ${k===''?'style="visibility:hidden"':''} onclick="window.__lk.key('${k}')">${k}</button>`).join('')}</div></div>`}
 window.__lk={pick(id){pick=id;pin='';draw()},async key(k){if(k==='⌫')pin=pin.slice(0,-1);else if(pin.length<4)pin+=k;draw();
   if(pin.length===4){const u=db.users.find(x=>x.id===pick);if(u&&await pinHash(u.id,pin)===u.pin){CUR=u;sessSet(u);root.innerHTML='';addLog('login','ورود به برنامه');save();layout();render();beep()}else{beep('warn');pin='';setTimeout(draw,150);toast('رمز اشتباه است')}}}};
 draw()}

/* ---------------- sync ---------------- */
const SY={url:'',key:'',on:false,state:'off',rev:-1,err:'',last:0,applying:false,tp:null,tq:null,info:null};
function sySaveCfg(){try{localStorage.setItem('anb_sync',JSON.stringify({url:SY.url,key:SY.key,on:SY.on}))}catch(e){}}
function syLoad(){try{Object.assign(SY,JSON.parse(localStorage.getItem('anb_sync')||'{}'))}catch(e){}}
const slim=()=>{const o={v:2,dead:db.dead,seq:db.seq,settings:db.settings};for(const c of COLS)o[c]=db[c];return o};
async function syFetch(path,opt={}){const url=(SY.url||'').replace(/\/+$/,'')+path;const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),20000);
 try{const r=await fetch(url,{...opt,signal:ctl.signal,headers:{'X-Key':SY.key,'Content-Type':'application/json'}});if(r.status===401)throw new Error('کد همگام‌سازی اشتباه است');if(!r.ok)throw new Error('خطای سرور '+r.status);return await r.json()}finally{clearTimeout(to)}}
function applyRemote(remote){const local=slim(),m=mergeDb(local,remote);
 const changed=JSON.stringify(m)!==JSON.stringify(mergeDb(local,local));
 SY.applying=true;try{for(const c of COLS)db[c]=m[c];db.dead=m.dead;db.seq={...db.seq,...m.seq};db.settings={...db.settings,...m.settings};recalc();if(changed)save()}finally{SY.applying=false}
 return changed}
async function syNow(){if(!SY.on)return;try{SY.state='sync';syUi();const r=await syFetch('/api/sync',{method:'POST',body:JSON.stringify({db:slim()})});const ch=applyRemote(r.db);SY.rev=r.rev;SY.state='ok';SY.err='';SY.last=Date.now();if(ch)uiRefresh()}catch(e){SY.state='err';SY.err=e.name==='AbortError'?'پاسخی از سرور نیامد':(e.message==='Failed to fetch'?'سرور در دسترس نیست':e.message)}syUi()}
async function syPoll(){if(!SY.on||SY.state==='sync')return;try{const r=await syFetch('/api/rev');if(r.rev!==SY.rev){const d=await syFetch('/api/db');const ch=applyRemote(d.db);SY.rev=d.rev;SY.last=Date.now();if(ch){uiRefresh();await syNow()}}SY.state='ok';SY.err=''}catch(e){SY.state='err';SY.err=e.message==='Failed to fetch'?'سرور در دسترس نیست':e.message}syUi()}
function syQueue(){if(!SY.on||SY.applying)return;clearTimeout(SY.tq);SY.tq=setTimeout(syNow,1500)}
dirtyHook=syQueue;
function uiRefresh(){if(document.querySelector('.scanfull')||$('#sheetRoot').innerHTML||document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName))return;if(R.id==='settings'){syUi();return}if(['dash','products','stock','docs','reports'].includes(R.id))rerender();else layout()}
function syStart(){clearInterval(SY.tp);if(SY.on){syNow();SY.tp=setInterval(syPoll,10000)}}
function syUi(){const el=$('#syStat');if(!el)return;const S={off:['p-gray','خاموش'],ok:['p-green','متصل'],sync:['p-blue','در حال همگام‌سازی…'],err:['p-red','قطع']}[SY.state]||['p-gray',''];
 el.innerHTML=`<span class="pill ${S[0]}">${S[1]}</span>${SY.err?` <span class="xs red">${esc(SY.err)}</span>`:''}${SY.last?` <span class="xs muted">آخرین: ${hhmm(SY.last)}</span>`:''}`}
function syncCard(){return`<div class="card"><div class="row" style="margin-bottom:8px"><div class="b sp">☁️ همگام‌سازی چند گوشی</div><span id="syStat"></span></div>
 <div class="fld"><label>آدرس سرور ${location.protocol==='http:'||location.protocol==='https:'?'(خالی = همین آدرس)':''}</label><input id="syUrl" class="inp ltr" value="${esc(SY.url)}" placeholder="http://192.168.1.20:8090"></div>
 <div class="fld"><label>کد همگام‌سازی (اگر سرور کد دارد)</label><input id="syKey" class="inp ltr" value="${esc(SY.key)}" placeholder="مثلاً 1234"></div>
 <div class="grid2"><button class="btn pri" onclick="syConnect()">${SY.on?'ذخیره و اتصال مجدد':'اتصال'}</button>${SY.on?`<button class="btn" onclick="syOff()">قطع</button>`:`<button class="btn" onclick="syHelp()">راهنما</button>`}</div>
 ${SY.on?`<button class="btn blk sm" onclick="syNow()">${ic('flip',16)} همین حالا همگام کن</button>`:''}
 <div class="hint">گوشی اصلی را با <b class="ltr">python serve.py 8090 --key 1234</b> روشن کن. گوشی‌های دیگر هم می‌توانند همین برنامه را روی localhost خودشان اجرا کنند و آدرس گوشی اصلی را اینجا بزنند.</div></div>`}
function syHelp(){sheet(`<h2>راهنمای همگام‌سازی</h2><div class="sm" style="line-height:2">۱) روی گوشی اصلی در Termux:<br><b class="ltr">cd ~/anbaryar && python serve.py 8090 --key 1234</b><br>۲) هر دو گوشی به یک Wi-Fi وصل باشند. آدرس IP گوشی اصلی در خروجی دستور چاپ می‌شود (مثل ۱۹۲٫۱۶۸٫۱٫۲۰).<br>۳) روی گوشی دوم: همین برنامه را اجرا کن (ترجیحاً با <b class="ltr">localhost</b> تا دوربین کار کند) و در تنظیمات → همگام‌سازی، آدرس <b class="ltr">http://IP:8090</b> و کد را بزن.<br>۴) از آن به بعد تغییرات هر دو گوشی خودکار ادغام می‌شود؛ بدون اینترنت هم کار می‌کنند و بعداً هماهنگ می‌شوند.</div><button class="btn blk" onclick="closeSheet()">متوجه شدم</button>`)}
async function syConnect(){SY.url=$('#syUrl').value.trim();SY.key=$('#syKey').value.trim();if(SY.url&&!/^https?:\/\//.test(SY.url))SY.url='http://'+SY.url;
 try{const p=await syFetch('/api/ping');if(p.app!=='anbaryar')throw new Error('این آدرس سرور انباریار نیست');await syFetch('/api/rev')}catch(e){SY.on=false;SY.state='err';SY.err=e.message==='Failed to fetch'?'سرور در دسترس نیست':e.message;sySaveCfg();syUi();return toast('اتصال نشد')}
 SY.on=true;SY.state='sync';SY.err='';sySaveCfg();syStart();rerender();toast('✓ متصل شد')}
function syOff(){SY.on=false;SY.state='off';clearInterval(SY.tp);sySaveCfg();rerender();toast('همگام‌سازی قطع شد')}

/* ================= init ================= */
(async function(){
 const had=await loadDB();syLoad();applyTheme();
 matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(db.prefs.theme==='auto')applyTheme()});
 if(db.users.length){const s=sessGet(),u=s&&db.users.find(x=>x.id===s.id);if(u)CUR=u;}
 $('#shell').classList.remove('hide');
 if(db.users.length&&!CUR){layout();showLock()}else render();
 if(SY.on){SY.state='sync';syStart()}
 autoBackup();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));
 window.__ready=true;
})();

</script>
